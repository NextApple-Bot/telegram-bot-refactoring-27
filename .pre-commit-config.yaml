repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.2
    hooks:
      - id: ruff
        args: [ --fix ]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -v -m "not integration"
        language: system
        pass_filenames: false
        always_run: true
