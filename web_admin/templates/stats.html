{% extends "base.html" %}

{% block page_title %}Статистика{% endblock %}

{% block content %}
<div class="card mb-4">
    <div class="card-header">
        <strong>Общая статистика</strong>
    </div>
    <div class="card-body">
        <div class="row text-center">
            <div class="col-md-4">
                <h6 class="text-muted">Продажи</h6>
                <h2>{{ sales_count }}</h2>
            </div>
            <div class="col-md-4">
                <h6 class="text-muted">Предзаказы</h6>
                <h2>{{ preorders_count }}</h2>
            </div>
            <div class="col-md-4">
                <h6 class="text-muted">Брони</h6>
                <h2>{{ bookings_count }}</h2>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Структура оплат</div>
            <div class="card-body">
                <canvas id="paymentChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Выручка по дням</div>
            <div class="card-body">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}
