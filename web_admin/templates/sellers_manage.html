{% extends "base.html" %}

{% block page_title %}Управление продавцами{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Продавцы</h4>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addSellerModal">
        <i class="bi bi-plus-lg"></i> Добавить продавца
    </button>
</div>

<div class="card">
    <div class="card-body">
        {% if sellers %}
            <div class="list-group">
                {% for seller in sellers %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>{{ seller.name }}</span>
                        <form action="/admin/sellers/delete/{{ seller.id }}" method="post" 
                              onsubmit="return confirm('Удалить продавца?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted">Продавцов пока нет.</p>
        {% endif %}
    </div>
</div>

<!-- Модалка добавления продавца -->
<div class="modal fade" id="addSellerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/admin/sellers/add" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить продавца</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Имя продавца</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
