<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <!-- Наши стили -->
    <link rel="stylesheet" href="/static/css/main.css">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Кнопка мобильного меню -->
    <button class="menu-toggle d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Сайдбар -->
    <div class="sidebar">
        <div class="logo">
            📊 Bot Admin
        </div>

        <nav class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if '/dashboard' in request.url.path %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Дашборд</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if '/assortment' in request.url.path %}active{% endif %}">
                <i class="bi bi-box-seam"></i>
                <span>Ассортимент</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if '/clients' in request.url.path %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if '/purchases' in request.url.path %}active{% endif %}">
                <i class="bi bi-cart"></i>
                <span>Покупки</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if '/sold' in request.url.path %}active{% endif %}">
                <i class="bi bi-check2-circle"></i>
                <span>Проданные</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if '/stats' in request.url.path %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>Статистика</span>
            </a>
        </nav>

        <div class="mt-auto pt-3 px-2">
            <a href="/admin/auth/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i>
                <span>Выйти</span>
            </a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">{% block page_title %}{% endblock %}</h2>
        </div>

        {% block content %}{% endblock %}
    </div>

    <!-- Универсальная модалка (управляется через Alpine.js) -->
    <div x-data="{ show: false }" 
         x-show="show" 
         class="modal fade" 
         :class="{ 'show d-block': show }"
         tabindex="-1"
         id="htmxModal"
         @hidden.bs.modal="show = false">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" x-text="modalTitle || 'Редактирование'"></h5>
                    <button type="button" class="btn-close" @click="show = false"></button>
                </div>
                <div class="modal-body" id="htmxModalContent">
                    <!-- Контент загружается через HTMX -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Скрипты -->
    <script>
        // Мобильное меню
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // Закрываем мобильное меню при клике вне его
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.querySelector('.menu-toggle');
            if (window.innerWidth <= 768 && sidebar && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('mobile-open');
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
