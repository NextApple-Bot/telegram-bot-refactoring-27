<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}
    
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #343a40; }
        .main-content { padding: 20px; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-3 text-white" style="width: 250px;">
            <h4 class="mb-4">🤖 Bot Admin</h4>
            
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i> Дашборд</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/assortment"><i class="bi bi-box-seam me-2"></i> Ассортимент</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/clients"><i class="bi bi-people me-2"></i> Клиенты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/purchases"><i class="bi bi-cart me-2"></i> Покупки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/sold"><i class="bi bi-check2-circle me-2"></i> Проданные</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/stats"><i class="bi bi-graph-up me-2"></i> Статистика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/sellers/manage"><i class="bi bi-person-badge me-2"></i> Продавцы</a>
                </li>
            </ul>
            
            <div class="mt-auto pt-4">
                <a href="/admin/auth/logout" class="btn btn-outline-light btn-sm w-100">
                    <i class="bi bi-box-arrow-right me-1"></i> Выйти
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>{% block page_title %}Панель управления{% endblock %}</h2>
            </div>
            
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
