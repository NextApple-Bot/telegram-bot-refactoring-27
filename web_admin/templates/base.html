<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <!-- Основные стили -->
    <link rel="stylesheet" href="/static/css/main.css">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Кнопка мобильного меню -->
    <button class="menu-toggle d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="logo">
            📊 Bot Admin
        </div>

        <nav class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Дашборд</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i>
                <span>Ассортимент</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart"></i>
                <span>Покупки</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-check2-circle"></i>
                <span>Проданные товары</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>Статистика</span>
            </a>
        </nav>

        <div class="mt-auto pt-3 px-2">
            <a href="/admin/auth/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i>
                <span>Выйти</span>
            </a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Универсальная модалка (HTMX + Alpine.js) -->
    <div x-data="{ show: false, modalTitle: 'Редактирование' }" 
         x-show="show" 
         class="modal fade" 
         :class="{ 'show d-block': show }"
         tabindex="-1"
         id="htmxModal"
         @hidden.bs.modal="show = false">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" x-text="modalTitle"></h5>
                    <button type="button" class="btn-close" @click="show = false"></button>
                </div>
                <div class="modal-body" id="htmxModalContent">
                    <!-- Контент загружается через HTMX -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Основные скрипты -->
    <script>
        // Переключение бокового меню на мобильных
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // Закрытие мобильного меню при клике вне его
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.querySelector('.menu-toggle');

            if (window.innerWidth <= 768 && sidebar && toggle) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    sidebar.classList.remove('mobile-open');
                }
            }
        });

        // Автоматическое закрытие модалки после успешного сохранения
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.xhr.status === 200 || evt.detail.xhr.status === 303) {
                const modal = document.getElementById('htmxModal');
                if (modal) {
                    const bootstrapModal = bootstrap.Modal.getInstance(modal);
                    if (bootstrapModal) {
                        bootstrapModal.hide();
                    }
                }
            }
        });

        // Функция обновления таблицы ассортимента
        function refreshAssortmentTable() {
            const container = document.getElementById('assortment-table-container');
            if (container) {
                htmx.ajax('GET', window.location.pathname + window.location.search, {
                    target: '#assortment-table-container',
                    swap: 'outerHTML'
                });
            }
        }

        // Обновляем таблицу после редактирования товара
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            const path = evt.detail.pathInfo.requestPath;
            if (path && path.includes('/admin/assortment/edit') && 
                (evt.detail.xhr.status === 200 || evt.detail.xhr.status === 303)) {
                
                setTimeout(() => {
                    refreshAssortmentTable();
                }, 350);
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
