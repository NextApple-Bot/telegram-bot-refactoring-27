<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="/static/css/main.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Кнопка меню для мобильных устройств -->
    <button class="menu-toggle d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="logo">
            📊 Bot Admin
        </div>
        
        <nav class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Дашборд</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i>
                <span>Ассортимент</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart"></i>
                <span>Покупки</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-check2-circle"></i>
                <span>Проданные</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>Статистика</span>
            </a>
            <a href="/admin/sellers/manage" class="nav-link {% if request.url.path.startswith('/admin/sellers') %}active{% endif %}">
                <i class="bi bi-person-badge"></i>
                <span>Продавцы</span>
            </a>
        </nav>

        <div class="mt-auto pt-4">
            <a href="/admin/auth/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i>
                <span>Выйти</span>
            </a>
            <div class="text-muted small mt-3 px-2">
                v3.1.0
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">{% block page_title %}{% endblock %}</h2>
        </div>

        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_scripts %}{% endblock %}

    <script>
        // Функция открытия/закрытия бокового меню на мобильных
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // Закрываем меню при клике вне его на мобильных устройствах
        document.addEventListener('click', function(event) {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.querySelector('.menu-toggle');

            if (window.innerWidth <= 768 && sidebar && toggleBtn) {
                if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
                    sidebar.classList.remove('mobile-open');
                }
            }
        });

        // Закрываем меню при изменении размера окна
        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (window.innerWidth > 768 && sidebar) {
                sidebar.classList.remove('mobile-open');
            }
        });
    </script>
</body>
</html>
