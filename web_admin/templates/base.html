<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <!-- Основные стили -->
    <link rel="stylesheet" href="/static/css/main.css">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Кнопка мобильного меню -->
    <button class="menu-toggle d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="logo">
            📊 Bot Admin
        </div>

        <nav class="nav flex-column">
            <a href="/admin/dashboard" class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Дашборд</span>
            </a>
            <a href="/admin/assortment" class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}">
                <i class="bi bi-box-seam"></i>
                <span>Ассортимент</span>
            </a>
            <a href="/admin/clients" class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span>Клиенты</span>
            </a>
            <a href="/admin/purchases" class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}">
                <i class="bi bi-cart"></i>
                <span>Покупки</span>
            </a>
            <a href="/admin/sold" class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}">
                <i class="bi bi-check2-circle"></i>
                <span>Проданные товары</span>
            </a>
            <a href="/admin/stats" class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>Статистика</span>
            </a>
        </nav>

        <div class="mt-auto pt-3 px-2">
            <a href="/admin/auth/logout" class="nav-link text-danger">
                <i class="bi bi-box-arrow-right"></i>
                <span>Выйти</span>
            </a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Универсальная модалка -->
    <div x-data="{ show: false, modalTitle: 'Редактирование', loading: false }" 
         x-show="show" 
         class="modal fade" 
         :class="{ 'show d-block': show }"
         tabindex="-1"
         id="htmxModal"
         @hidden.bs.modal="show = false; loading = false">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" x-text="modalTitle"></h5>
                    <button type="button" class="btn-close" @click="show = false"></button>
                </div>
                <div class="modal-body position-relative" id="htmxModalContent">
                    <!-- Спиннер загрузки -->
                    <div x-show="loading" 
                         class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75"
                         style="z-index: 10; border-radius: 0.5rem;">
                        <div class="text-center">
                            <div class="spinner-border text-primary mb-2" role="status"></div>
                            <div class="small text-muted">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast контейнер (уведомления) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="toast-container"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Основные скрипты -->
    <script>
        // Переключение бокового меню на мобильных
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // Закрытие мобильного меню при клике вне его
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.querySelector('.menu-toggle');

            if (window.innerWidth <= 768 && sidebar && toggle) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    sidebar.classList.remove('mobile-open');
                }
            }
        });

        // Функция показа Toast-уведомления
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toast-container');
            
            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'success' ? 'bg-success' : 
                           type === 'error' ? 'bg-danger' : 'bg-primary';
            
            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 4000 });
            toast.show();
            
            // Удаляем toast из DOM после скрытия
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        // Показываем спиннер при загрузке контента в модалку
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const modalContent = document.getElementById('htmxModalContent');
            if (modalContent && evt.detail.target === modalContent) {
                const alpineData = Alpine.$data(document.getElementById('htmxModal'));
                if (alpineData) alpineData.loading = true;
            }
        });

        // Скрываем спиннер и показываем уведомления после HTMX-запросов
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            const modalContent = document.getElementById('htmxModalContent');
            if (modalContent && evt.detail.target === modalContent) {
                const alpineData = Alpine.$data(document.getElementById('htmxModal'));
                if (alpineData) alpineData.loading = false;
            }

            // Автоматическое закрытие модалки после успешного сохранения
            if ((evt.detail.xhr.status === 200 || evt.detail.xhr.status === 303) && 
                evt.detail.pathInfo.requestPath.includes('/edit')) {
                
                const modal = document.getElementById('htmxModal');
                if (modal) {
                    const bootstrapModal = bootstrap.Modal.getInstance(modal);
                    if (bootstrapModal) bootstrapModal.hide();
                }
                
                // Показываем уведомление об успехе
                showToast('Изменения успешно сохранены', 'success');
            }

            // Уведомление при удалении
            if (evt.detail.xhr.status === 200 && evt.detail.pathInfo.requestPath.includes('/delete')) {
                showToast('Товар успешно удалён', 'success');
            }
        });

        // Обновление таблицы после редактирования/удаления
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            const path = evt.detail.pathInfo.requestPath;
            
            if (path && (path.includes('/admin/assortment/edit') || path.includes('/admin/assortment/delete'))) {
                if (evt.detail.xhr.status === 200 || evt.detail.xhr.status === 303) {
                    setTimeout(() => {
                        const container = document.getElementById('assortment-table-container');
                        if (container) {
                            htmx.ajax('GET', window.location.pathname + window.location.search, {
                                target: '#assortment-table-container',
                                swap: 'outerHTML'
                            });
                        }
                    }, 350);
                }
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
