<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <div class="d-flex align-items-center mb-4 px-2">
            <span class="fs-4 fw-bold">🤖 Bot Admin</span>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link text-white {% if request.url.path.startswith('/admin/dashboard') %}active bg-secondary{% endif %}">
                    <i class="bi bi-speedometer2 me-2"></i> Дашборд
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/assortment" class="nav-link text-white {% if request.url.path.startswith('/admin/assortment') %}active bg-secondary{% endif %}">
                    <i class="bi bi-box-seam me-2"></i> Ассортимент
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/clients" class="nav-link text-white {% if request.url.path.startswith('/admin/clients') %}active bg-secondary{% endif %}">
                    <i class="bi bi-people me-2"></i> Клиенты
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/purchases" class="nav-link text-white {% if request.url.path.startswith('/admin/purchases') %}active bg-secondary{% endif %}">
                    <i class="bi bi-cart-check me-2"></i> Покупки
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/sold" class="nav-link text-white {% if request.url.path.startswith('/admin/sold') %}active bg-secondary{% endif %}">
                    <i class="bi bi-archive me-2"></i> Продано
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/stats" class="nav-link text-white {% if request.url.path.startswith('/admin/stats') %}active bg-secondary{% endif %}">
                    <i class="bi bi-graph-up me-2"></i> Статистика
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/sellers/manage" class="nav-link text-white {% if request.url.path.startswith('/admin/sellers') %}active bg-secondary{% endif %}">
                    <i class="bi bi-person-badge me-2"></i> Продавцы
                </a>
            </li>
        </ul>

        <div class="mt-auto pt-4 px-2">
            <a href="/admin/auth/logout" class="btn btn-outline-light w-100">
                <i class="bi bi-box-arrow-right me-2"></i> Выйти
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">{% block page_title %}Панель управления{% endblock %}</h4>
        </div>

        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
