<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
    
    <style>
        [x-cloak] { display: none !important; }
        .nav-text { transition: all 0.2s ease; }
        
        /* Стили модалки */
        .modal {
            animation: modalPop 0.2s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50">
    
    <div x-data="{ sidebarOpen: false, collapsed: localStorage.getItem('sidebarCollapsed') === 'true' }" 
         @sidebar-toggle.window="collapsed = !collapsed; localStorage.setItem('sidebarCollapsed', collapsed)">
        
        <!-- Mobile Top Bar -->
        <div class="lg:hidden bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-40">
            <div class="flex items-center gap-x-3">
                <button @click="sidebarOpen = true" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <span class="font-semibold text-2xl tracking-tight">NextStore</span>
            </div>
        </div>

        <div class="flex min-h-screen">
            
            <!-- Desktop Sidebar -->
            <div class="hidden lg:flex flex-col bg-white border-r border-slate-200 h-screen sticky top-0"
                 :class="collapsed ? 'w-20' : 'w-72'">
                
                <div class="flex items-center justify-between px-5 py-6 border-b">
                    <div class="flex items-center gap-x-3" :class="{ 'justify-center w-full': collapsed }">
                        <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center flex-shrink-0">
                            <span class="text-white text-2xl font-bold">N</span>
                        </div>
                        <span x-show="!collapsed" class="font-semibold text-3xl tracking-tighter">NextStore</span>
                    </div>
                    
                    <button @click="$dispatch('sidebar-toggle')" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl" x-show="!collapsed">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button @click="$dispatch('sidebar-toggle')" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl" x-show="collapsed">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Навигация -->
                <nav class="flex-1 px-4 py-8 space-y-1.5 text-[15px]">
                    {% include 'partials/sidebar_nav.html' %}
                </nav>

                <div class="p-4 border-t">
                    <a href="/admin/auth/logout" class="flex items-center gap-x-3.5 px-4 py-3 text-red-600 hover:bg-red-50 rounded-2xl">
                        <i class="fas fa-sign-out-alt w-5 text-lg"></i>
                        <span x-show="!collapsed" class="font-medium">Выйти</span>
                    </a>
                </div>
            </div>

            <!-- Mobile Drawer -->
            <div x-show="sidebarOpen" class="lg:hidden fixed inset-0 z-[999] bg-black/40" @click="sidebarOpen = false">
                <div @click.stop class="w-80 bg-white h-full shadow-2xl"
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="-translate-x-full"
                     x-transition:enter-end="translate-x-0">
                    
                    <div class="flex items-center justify-between px-6 py-5 border-b">
                        <div class="flex items-center gap-x-3">
                            <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center">
                                <span class="text-white text-2xl font-bold">N</span>
                            </div>
                            <span class="font-semibold text-3xl tracking-tighter">NextStore</span>
                        </div>
                        <button @click="sidebarOpen = false" class="p-3 text-slate-400">
                            <i class="fas fa-times text-2xl"></i>
                        </button>
                    </div>

                    <nav class="p-4 space-y-1 text-[15px]">
                        {% include 'partials/sidebar_nav.html' %}
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="flex-1 min-w-0">
                <div class="max-w-7xl mx-auto px-6 py-8">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== МОДАЛЬНОЕ ОКНО (ОБЯЗАТЕЛЬНО!) ==================== -->
    <div 
        x-data="{ show: false, modalTitle: '' }"
        x-show="show"
        @keydown.escape.window="show = false"
        class="fixed inset-0 z-[999] flex items-center justify-center bg-black/60 p-4"
        style="display: none;"
    >
        <div 
            @click.away="show = false"
            class="modal bg-white rounded-3xl shadow-2xl w-full max-w-3xl overflow-hidden"
        >
            <!-- Заголовок модалки -->
            <div class="flex items-center justify-between px-6 py-4 border-b bg-slate-50">
                <h3 class="text-xl font-semibold text-slate-900" x-text="modalTitle"></h3>
                <button 
                    @click="show = false" 
                    class="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition-colors"
                >
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <!-- Контент, который загружает HTMX -->
            <div id="htmxModalContent" class="p-6 max-h-[75vh] overflow-auto">
                <!-- Сюда подгружается содержимое форм (edit / sale) -->
            </div>
        </div>
    </div>
    <!-- ==================== КОНЕЦ МОДАЛЬНОГО ОКНА ==================== -->

    {% block extra_scripts %}{% endblock %}
</body>
</html>
