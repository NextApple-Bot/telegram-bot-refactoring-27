<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bot Admin{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    {% block extra_head %}{% endblock %}
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            color: #adb5bd;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .sidebar .nav-link:hover {
            background-color: #343a40;
            color: white;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .main-content {
            padding: 25px;
        }
        .card {
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <div class="d-flex align-items-center mb-4 px-2">
                    <h4 class="text-white mb-0">🤖 <strong>Bot Admin</strong></h4>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}" 
                           href="/admin/dashboard">
                            <i class="bi bi-speedometer2 me-2"></i> Дашборд
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/assortment') %}active{% endif %}" 
                           href="/admin/assortment">
                            <i class="bi bi-box-seam me-2"></i> Ассортимент
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/clients') %}active{% endif %}" 
                           href="/admin/clients">
                            <i class="bi bi-people me-2"></i> Клиенты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/purchases') %}active{% endif %}" 
                           href="/admin/purchases">
                            <i class="bi bi-cart me-2"></i> Покупки
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/sold') %}active{% endif %}" 
                           href="/admin/sold">
                            <i class="bi bi-archive me-2"></i> Проданные
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/stats') %}active{% endif %}" 
                           href="/admin/stats">
                            <i class="bi bi-graph-up me-2"></i> Статистика
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/admin/sellers') %}active{% endif %}" 
                           href="/admin/sellers/manage">
                            <i class="bi bi-person-badge me-2"></i> Продавцы
                        </a>
                    </li>
                </ul>

                <div class="mt-auto px-2 pt-4">
                    <a href="/admin/auth/logout" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right me-2"></i> Выйти
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">{% block page_title %}Панель управления{% endblock %}</h2>
                </div>

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
