<!-- Форма продажи товара -->
<form
    hx-post="/admin/assortment/sale/{{ item.id }}"
    hx-target="#htmxModalContent"
    hx-swap="outerHTML"
    hx-indicator="#sale-spinner"
    class="space-y-5">

    {% if error %}
    <div class="rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 px-4 py-3 text-sm text-red-700 dark:text-red-300">
        <strong>Ошибка:</strong> {{ error }}
    </div>
    {% endif %}

    <!-- Product info -->
    <div class="rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 px-4 py-3">
        <p class="text-sm font-medium text-slate-900 dark:text-white">{{ item.text }}</p>
        {% if item.serial %}
        <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
            Серийный номер: <code class="font-mono text-indigo-600 dark:text-indigo-400">{{ item.serial }}</code>
        </p>
        {% endif %}
    </div>

    <!-- Main fields -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">
                Цена продажи <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <input type="number" step="0.01" name="sale_price" required
                       value="{{ form_data.sale_price if form_data else (item.booking_price or '') }}"
                       class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 pl-3 pr-10 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">₽</span>
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">
                Способ оплаты <span class="text-red-500">*</span>
            </label>
            <select name="payment_type" required
                    class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="">— Выберите —</option>
                <option value="cash" {% if form_data and form_data.payment_type == 'cash' %}selected{% endif %}>💵 Наличными</option>
                <option value="terminal" {% if form_data and form_data.payment_type == 'terminal' %}selected{% endif %}>💳 Терминал</option>
                <option value="qr" {% if form_data and form_data.payment_type == 'qr' %}selected{% endif %}>📱 QR-код</option>
                <option value="transfer" {% if form_data and form_data.payment_type == 'transfer' %}selected{% endif %}>↗️ Перевод</option>
                <option value="invoice" {% if form_data and form_data.payment_type == 'invoice' %}selected{% endif %}>📄 По счёту</option>
                <option value="installment" {% if form_data and form_data.payment_type == 'installment' %}selected{% endif %}>📅 Рассрочка</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">Сумма оплаты</label>
            <div class="relative">
                <input type="number" step="0.01" name="paid_amount"
                       value="{{ form_data.paid_amount if form_data else (item.booking_price or '') }}"
                       class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 pl-3 pr-10 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">₽</span>
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">Сдача / Остаток</label>
            <div class="relative">
                <input type="number" step="0.01" name="change_amount"
                       value="{{ form_data.change_amount if form_data else 0 }}"
                       class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 pl-3 pr-10 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">₽</span>
            </div>
        </div>
    </div>

    <div>
        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">Комментарий</label>
        <textarea name="sale_comment" rows="2" placeholder="Дополнительная информация..."
                  class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none">{{ form_data.sale_comment if form_data else '' }}</textarea>
    </div>

    <label class="flex items-center gap-3 cursor-pointer select-none">
        <input type="checkbox" name="create_client" value="on"
               class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
               {% if not form_data or form_data.create_client %}checked{% endif %}>
        <span class="text-sm text-slate-700 dark:text-slate-300">Создать / обновить данные клиента</span>
    </label>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-100 dark:border-slate-800">
        <button type="button"
                @click="$store.modal.show = false"
                class="px-4 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
            Отмена
        </button>
        <button type="submit"
                class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-sm transition-colors">
            <i class="fas fa-check"></i>
            Продать товар
            <span id="sale-spinner" class="htmx-indicator">
                <i class="fas fa-spinner fa-spin"></i>
            </span>
        </button>
    </div>
</form>
