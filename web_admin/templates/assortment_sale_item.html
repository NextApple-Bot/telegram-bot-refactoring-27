<!-- Форма продажи товара с обработкой ошибок -->
<form 
    hx-post="/admin/assortment/sale/{{ item.id }}"
    hx-target="#htmxModalContent"
    hx-swap="outerHTML"
    hx-indicator="#sale-spinner">

    <div class="modal-body">

        <!-- Блок ошибок -->
        {% if error %}
            <div class="alert alert-danger mb-4">
                <strong>Ошибка:</strong> {{ error }}
            </div>
        {% endif %}

        <!-- Информация о товаре -->
        <div class="alert alert-light mb-4">
            <strong>Товар:</strong> {{ item.text }}<br>
            {% if item.serial %}
                <strong>Серийный номер:</strong> <code>{{ item.serial }}</code>
            {% endif %}
        </div>

        <!-- Основные поля продажи -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Цена продажи <span class="text-danger">*</span></label>
                <input type="number" step="0.01" name="sale_price" class="form-control" 
                       value="{{ form_data.sale_price if form_data else (item.booking_price or '') }}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Способ оплаты <span class="text-danger">*</span></label>
                <select name="payment_type" class="form-select" required>
                    <option value="">-- Выберите способ оплаты --</option>
                    <option value="cash" {% if form_data and form_data.payment_type == 'cash' %}selected{% endif %}>Наличными</option>
                    <option value="terminal" {% if form_data and form_data.payment_type == 'terminal' %}selected{% endif %}>Терминал</option>
                    <option value="qr" {% if form_data and form_data.payment_type == 'qr' %}selected{% endif %}>QR-код</option>
                    <option value="transfer" {% if form_data and form_data.payment_type == 'transfer' %}selected{% endif %}>Перевод</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Сумма оплаты</label>
                <input type="number" step="0.01" name="paid_amount" class="form-control" 
                       value="{{ form_data.paid_amount if form_data else (item.booking_price or '') }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Сдача / Остаток</label>
                <input type="number" step="0.01" name="change_amount" class="form-control" 
                       value="{{ form_data.change_amount if form_data else 0 }}">
            </div>
        </div>

        <hr>

        <!-- Дополнительная информация -->
        <h6 class="mb-3">Дополнительно</h6>

        <div class="mb-3">
            <label class="form-label">Комментарий к продаже</label>
            <textarea name="sale_comment" class="form-control" rows="2" 
                      placeholder="Дополнительная информация...">{{ form_data.sale_comment if form_data else '' }}</textarea>
        </div>

        <!-- Создать клиента -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="create_client" id="create_client"
                   {% if not form_data or form_data.create_client %}checked{% endif %}>
            <label class="form-check-label" for="create_client">
                Создать/обновить данные клиента
            </label>
        </div>

    </div>

    <!-- Кнопки -->
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        
        <button type="submit" class="btn btn-success d-flex align-items-center gap-2">
            <span>Продать товар</span>
            <span id="sale-spinner" class="htmx-indicator">
                <span class="spinner-border spinner-border-sm" role="status"></span>
            </span>
        </button>
    </div>

</form>
