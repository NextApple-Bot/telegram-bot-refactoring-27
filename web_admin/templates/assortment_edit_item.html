{% extends "base.html" %}

{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}

{% block content %}
<form method="post" action="/admin/assortment/edit/{{ item.id }}">
    <div class="card mb-4">
        <div class="card-header">
            <strong>Основные данные</strong>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Текст товара</label>
                        <input type="text" name="text" class="form-control" value="{{ item.text }}" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Серийный номер</label>
                        <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Категория</label>
                        <select name="category_id" class="form-select">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_booked" value="true"
                               {% if item.is_booked %}checked{% endif %}>
                        <label class="form-check-label">Забронирован</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Блок продажи -->
    <div class="card mb-4 border-danger">
        <div class="card-header bg-danger text-white">
            <strong>Продажа товара</strong>
        </div>
        <div class="card-body">
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="is_sold" value="true" id="isSoldCheck">
                <label class="form-check-label text-danger" for="isSoldCheck">
                    Продать этот товар
                </label>
            </div>

            <div id="saleFields" style="display: none;">
                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label>Стоимость</label>
                            <input type="number" step="0.01" name="sale_price" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label>П/О</label>
                            <input type="number" step="0.01" name="sale_prepayment" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label>Оплата</label>
                            <input type="number" step="0.01" name="sale_payment_amount" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Здесь можно добавить поля для аксессуаров, клиента, бонуса и т.д. -->
                <small class="text-muted">Полная форма продажи с аксессуарами и клиентом доступна в полной версии.</small>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    </div>
</form>

<script>
document.getElementById('isSoldCheck').addEventListener('change', function() {
    document.getElementById('saleFields').style.display = this.checked ? 'block' : 'none';
});
</script>
{% endblock %}
