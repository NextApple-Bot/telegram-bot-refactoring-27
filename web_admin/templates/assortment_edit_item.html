{% extends "base.html" %}

{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Редактировать товар #{{ item.id }}</h3>
        <a href="/admin/assortment" class="btn btn-secondary">← Назад к ассортименту</a>
    </div>

    <form method="post" action="/admin/assortment/edit/{{ item.id }}">
        <div class="row">
            <!-- Основная информация -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <strong>Основная информация</strong>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Текст товара</label>
                            <textarea name="text" class="form-control" rows="3" required>{{ item.text }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Серийный номер</label>
                            <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select name="category_id" class="form-select" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                        {{ cat.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Статус -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <strong>Статус</strong>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="is_booked" id="is_booked" 
                                   {% if item.is_booked %}checked{% endif %}>
                            <label class="form-check-label" for="is_booked">
                                Забронирован
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_sold" id="is_sold">
                            <label class="form-check-label" for="is_sold">
                                Продать товар
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок бронирования -->
        <div class="card mb-4" id="booking_section">
            <div class="card-header bg-warning text-dark">
                <strong>Бронирование</strong>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Стоимость *</label>
                        <input type="number" step="0.01" name="booking_price" class="form-control" 
                               value="{{ item.booking_price or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Предоплата</label>
                        <input type="number" step="0.01" name="booking_prepayment" class="form-control" 
                               value="{{ item.booking_prepayment or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Способ оплаты</label>
                        <select name="booking_payment_type" class="form-select">
                            <option value="">Не указан</option>
                            <option value="cash" {% if item.booking_payment_type == 'cash' %}selected{% endif %}>Наличные</option>
                            <option value="terminal" {% if item.booking_payment_type == 'terminal' %}selected{% endif %}>Терминал</option>
                            <option value="qr" {% if item.booking_payment_type == 'qr' %}selected{% endif %}>QR-код</option>
                            <option value="transfer" {% if item.booking_payment_type == 'transfer' %}selected{% endif %}>Перевод</option>
                        </select>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <label class="form-label">ФИО</label>
                        <input type="text" name="booking_full_name" class="form-control" value="{{ item.booking_full_name or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Телефон</label>
                        <input type="text" name="booking_phone" class="form-control" value="{{ item.booking_phone or '' }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок продажи -->
        <div class="card mb-4" id="sale_section" style="display: none;">
            <div class="card-header bg-success text-white">
                <strong>Продажа товара</strong>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Стоимость *</label>
                        <input type="number" step="0.01" name="sale_price" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Сумма оплаты</label>
                        <input type="number" step="0.01" name="sale_payment_amount" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Способ оплаты</label>
                        <select name="sale_payment_type" class="form-select">
                            <option value="cash">Наличные</option>
                            <option value="terminal">Терминал</option>
                            <option value="qr">QR-код</option>
                            <option value="transfer">Перевод</option>
                            <option value="invoice">По счёту</option>
                            <option value="installment">Рассрочка</option>
                            <option value="paid">Оплачен</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script>
// Показываем/скрываем блоки в зависимости от чекбоксов
document.getElementById('is_booked').addEventListener('change', function() {
    document.getElementById('booking_section').style.display = this.checked ? 'block' : 'none';
});

document.getElementById('is_sold').addEventListener('change', function() {
    document.getElementById('sale_section').style.display = this.checked ? 'block' : 'none';
});

// Инициализация при загрузке
window.onload = function() {
    if (document.getElementById('is_booked').checked) {
        document.getElementById('booking_section').style.display = 'block';
    }
    if (document.getElementById('is_sold').checked) {
        document.getElementById('sale_section').style.display = 'block';
    }
}
</script>
{% endblock %}
