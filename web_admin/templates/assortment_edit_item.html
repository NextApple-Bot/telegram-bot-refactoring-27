{% extends "base.html" %}

{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}

{% block content %}
<form method="post" action="/admin/assortment/edit/{{ item.id }}">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Текст товара</label>
                        <input type="text" name="text" class="form-control" value="{{ item.text }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Серийный номер</label>
                        <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
                    </div>
                    <div class="mb-3">
                        <label>Категория</label>
                        <select name="category_id" class="form-select">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_booked" value="true" 
                               {% if item.is_booked %}checked{% endif %}>
                        <label class="form-check-label">Забронирован</label>
                    </div>
                    
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_sold" value="true">
                        <label class="form-check-label text-danger">Продать товар</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card-footer d-flex justify-content-between">
            <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        </div>
    </div>
</form>
{% endblock %}
