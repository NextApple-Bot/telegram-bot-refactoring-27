{% extends "base.html" %}

{% block title %}Добавление товара{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <!-- Заголовок -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight">Добавление нового товара</h1>
            <p class="text-slate-500 mt-1">Заполните информацию о товаре</p>
        </div>

        <a href="/admin/assortment"
           class="flex items-center gap-x-2 px-4 py-2 text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors">
            <i class="fas fa-arrow-left"></i>
            <span>К списку</span>
        </a>
    </div>

    <form action="/admin/assortment/add" method="post" class="space-y-8">

        <div class="bg-white border border-slate-200 rounded-3xl p-8 space-y-6">

            <!-- Название товара -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Название товара <span class="text-red-500">*</span></label>
                <input type="text" name="text" required
                       class="w-full border border-slate-300 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       placeholder="Например: iPhone 17 Pro Max 256GB">
            </div>

            <!-- Серийный номер -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Серийный номер</label>
                <input type="text" name="serial"
                       class="w-full border border-slate-300 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       placeholder="Введите серийный номер (если есть)">
            </div>

            <!-- Категория (модульный компонент) -->
            {% include 'partials/form/category_field.html' %}

            <!-- Статус брони -->
            <div class="flex items-center gap-x-3 pt-2">
                <input type="checkbox" name="is_booked" value="true" id="is_booked"
                       class="w-5 h-5 accent-indigo-600 rounded">
                <label for="is_booked" class="text-sm font-medium cursor-pointer select-none">
                    Сразу забронировать
                </label>
            </div>

        </div>

        <!-- Кнопки -->
        <div class="flex items-center justify-between pt-4">
            <button type="submit"
                    class="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-2xl transition-colors flex items-center gap-x-2">
                <i class="fas fa-plus mr-2"></i>
                Добавить товар
            </button>

            <a href="/admin/assortment"
               class="px-6 py-3.5 text-slate-600 hover:text-slate-900 font-medium rounded-2xl hover:bg-slate-100 transition-colors">
                Отмена
            </a>
        </div>

    </form>
</div>
{% endblock %}
