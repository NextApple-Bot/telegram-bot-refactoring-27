{% extends "base.html" %}
{% block title %}Редактирование товара{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-semibold tracking-tight">Редактировать товар #{{ item.id }}</h1>
        <p class="text-slate-500 mt-1">{{ item.text }}</p>
    </div>

    <form 
        hx-post="/admin/assortment/edit/{{ item.id }}"
        hx-target="#htmxModalContent"
        hx-swap="outerHTML"
        class="space-y-8">

        <div class="bg-white border border-slate-200 rounded-3xl p-8 space-y-6">

            <!-- Название -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Название товара <span class="text-red-500">*</span></label>
                <input type="text" name="text" value="{{ item.text }}" required
                       class="w-full border border-slate-300 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Серийный номер -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Серийный номер</label>
                <input type="text" name="serial" value="{{ item.serial or '' }}"
                       class="w-full border border-slate-300 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Категория -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Категория <span class="text-red-500">*</span></label>
                <select name="category_id" class="w-full border border-slate-300 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <hr class="my-4">

            <!-- Бронирование -->
            <div>
                <h3 class="font-semibold text-slate-700 mb-4">Данные бронирования</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Цена брони</label>
                        <input type="number" step="0.01" name="booking_price" value="{{ item.booking_price or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Предоплата</label>
                        <input type="number" step="0.01" name="booking_prepayment" value="{{ item.booking_prepayment or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ФИО клиента</label>
                        <input type="text" name="booking_full_name" value="{{ item.booking_full_name or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Телефон</label>
                        <input type="text" name="booking_phone" value="{{ item.booking_phone or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <!-- Продажа -->
            <div>
                <h3 class="font-semibold text-slate-700 mb-4">Данные продажи</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Цена продажи</label>
                        <input type="number" step="0.01" name="sale_price" value="{{ item.sale_price or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Способ оплаты</label>
                        <input type="text" name="sale_payment_type" value="{{ item.sale_payment_type or '' }}"
                               class="w-full border border-slate-300 rounded-2xl px-4 py-2.5">
                    </div>
                </div>
            </div>

        </div>

        <!-- Кнопки -->
        <div class="flex items-center justify-end gap-x-4 pt-4">
            <button type="button"
                    @click="$store.modal.show = false"
                    class="px-6 py-3 text-slate-600 hover:text-slate-900 font-medium rounded-2xl hover:bg-slate-100 transition-colors">
                Отмена
            </button>
            <button type="submit"
                    class="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-2xl transition-colors flex items-center gap-x-2">
                <i class="fas fa-save mr-2"></i>
                Сохранить изменения
            </button>
        </div>

    </form>
</div>
{% endblock %}
