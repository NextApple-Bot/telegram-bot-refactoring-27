{% extends "base.html" %}

{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Редактировать товар</h4>
    <a href="/admin/assortment" class="btn btn-outline-secondary">← Назад к ассортименту</a>
</div>

<form action="/admin/assortment/edit/{{ item.id }}" method="post" id="editForm">

    <!-- Основная информация -->
    <div class="card mb-4">
        <div class="card-header"><strong>Основная информация</strong></div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Текст товара</label>
                        <input type="text" name="text" class="form-control" value="{{ item.text }}" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Серийный номер</label>
                        <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Категория</label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- Бронь -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Бронь</strong>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_booked" id="is_booked" 
                       {% if item.is_booked %}checked{% endif %}>
                <label class="form-check-label" for="is_booked">Забронировано</label>
            </div>
        </div>
        <div class="card-body" id="bookingFields">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Стоимость</label>
                    <input type="number" step="0.01" name="booking_price" class="form-control" value="{{ item.booking_price or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Предоплата (П/О)</label>
                    <input type="number" step="0.01" name="booking_prepayment" class="form-control" value="{{ item.booking_prepayment or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Способ оплаты</label>
                    <select name="booking_payment_type" class="form-select">
                        <option value="">Не указан</option>
                        <option value="cash" {% if item.booking_payment_type == 'cash' %}selected{% endif %}>Наличные</option>
                        <option value="terminal" {% if item.booking_payment_type == 'terminal' %}selected{% endif %}>Терминал</option>
                        <option value="qr" {% if item.booking_payment_type == 'qr' %}selected{% endif %}>QR-код</option>
                        <option value="transfer" {% if item.booking_payment_type == 'transfer' %}selected{% endif %}>Перевод</option>
                    </select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-4">
                    <label class="form-label">Площадка</label>
                    <input type="text" name="booking_platform" class="form-control" value="{{ item.booking_platform or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">ФИО клиента</label>
                    <input type="text" name="booking_full_name" class="form-control" value="{{ item.booking_full_name or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Телефон</label>
                    <input type="text" name="booking_phone" class="form-control" value="{{ item.booking_phone or '' }}">
                </div>
            </div>
        </div>
    </div>

    <!-- Продажа -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Продажа (товар будет удалён)</strong>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="is_sold" id="is_sold">
                <label class="form-check-label" for="is_sold">Продать сейчас</label>
            </div>
        </div>
        <div class="card-body" id="saleFields" style="display: none;">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Стоимость</label>
                    <input type="number" step="0.01" name="sale_price" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Предоплата</label>
                    <input type="number" step="0.01" name="sale_prepayment" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Сумма оплаты</label>
                    <input type="number" step="0.01" name="sale_payment_amount" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Способ оплаты</label>
                    <select name="sale_payment_type" class="form-select">
                        <option value="cash">Наличные</option>
                        <option value="terminal">Терминал</option>
                        <option value="qr">QR-код</option>
                        <option value="transfer">Перевод</option>
                        <option value="paid">Оплачен</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="/admin/assortment" class="btn btn-outline-secondary">Отмена</a>
    </div>

</form>

{% endblock %}

{% block extra_scripts %}
<script>
    // Показываем/скрываем секцию продажи
    const isSoldCheckbox = document.getElementById('is_sold');
    const saleFields = document.getElementById('saleFields');

    isSoldCheckbox.addEventListener('change', function() {
        saleFields.style.display = this.checked ? 'block' : 'none';
    });
</script>
{% endblock %}
