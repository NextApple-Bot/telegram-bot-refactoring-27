<!-- Форма редактирования товара -->
<form 
    hx-post="/admin/assortment/edit/{{ item.id }}"
    hx-target="#htmxModalContent"
    hx-swap="outerHTML"
    hx-indicator="#save-spinner">

    <div class="modal-body">

        <!-- Основная информация -->
        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Название товара <span class="text-danger">*</span></label>
                <input type="text" name="text" class="form-control" value="{{ item.text }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Серийный номер</label>
                <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Категория <span class="text-danger">*</span></label>
            <select name="category_id" class="form-select" required>
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <hr class="my-4">

        <!-- Бронирование -->
        <h6 class="mb-3 fw-semibold">Бронирование</h6>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Стоимость брони</label>
                <input type="number" step="0.01" name="booking_price" class="form-control" value="{{ item.booking_price or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Предоплата (П/О)</label>
                <input type="number" step="0.01" name="booking_prepayment" class="form-control" value="{{ item.booking_prepayment or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Бонус / Скидка</label>
                <input type="number" step="0.01" name="booking_bonus" class="form-control" value="{{ item.booking_bonus or '' }}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">ФИО клиента</label>
                <input type="text" name="booking_full_name" class="form-control" value="{{ item.booking_full_name or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Телефон</label>
                <input type="text" name="booking_phone" class="form-control" value="{{ item.booking_phone or '' }}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Площадка</label>
                <input type="text" name="booking_platform" class="form-control" value="{{ item.booking_platform or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Telegram</label>
                <input type="text" name="booking_telegram_username" class="form-control" value="{{ item.booking_telegram_username or '' }}" placeholder="@username">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Комментарий</label>
                <input type="text" name="booking_comment" class="form-control" value="{{ item.booking_comment or '' }}">
            </div>
        </div>

    </div>

    <!-- Кнопки -->
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        
        <button type="submit" class="btn btn-success d-flex align-items-center gap-2">
            <span>Сохранить изменения</span>
            
            <!-- Спиннер при сохранении -->
            <span class="htmx-indicator">
                <span class="spinner-border spinner-border-sm" role="status"></span>
            </span>
        </button>
    </div>

</form>
