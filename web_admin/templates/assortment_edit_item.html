{% extends "base.html" %}

{% block page_title %}Редактировать товар #{{ item.id }}{% endblock %}

{% block content %}
<form method="post" action="/admin/assortment/edit/{{ item.id }}">
    <div class="card mb-4">
        <div class="card-header"><strong>Основная информация</strong></div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label>Текст товара</label>
                        <textarea name="text" class="form-control" rows="2" required>{{ item.text }}</textarea>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label>Серийный номер</label>
                        <input type="text" name="serial" class="form-control" value="{{ item.serial or '' }}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Категория</label>
                        <select name="category_id" class="form-select">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" name="is_booked" value="true"
                               {% if item.is_booked %}checked{% endif %}>
                        <label class="form-check-label">Забронирован</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Блок продажи -->
    <div class="card border-danger mb-4">
        <div class="card-header bg-danger text-white">
            <strong>Продажа</strong>
        </div>
        <div class="card-body">
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="is_sold" id="sellToggle">
                <label class="form-check-label text-danger">Продать этот товар</label>
            </div>

            <div id="saleBlock" style="display:none;">
                <div class="row">
                    <div class="col-md-3">
                        <label>Стоимость</label>
                        <input type="number" step="0.01" name="sale_price" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>П/О</label>
                        <input type="number" step="0.01" name="sale_prepayment" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Сумма оплаты</label>
                        <input type="number" step="0.01" name="sale_payment_amount" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Способ оплаты</label>
                        <select name="sale_payment_type" class="form-select">
                            <option value="cash">Наличные</option>
                            <option value="terminal">Терминал</option>
                            <option value="qr">QR-код</option>
                            <option value="transfer">Перевод</option>
                            <option value="invoice">По счёту</option>
                            <option value="installment">Рассрочка</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a href="/admin/assortment" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
</form>

<script>
document.getElementById('sellToggle').addEventListener('change', function() {
    document.getElementById('saleBlock').style.display = this.checked ? 'block' : 'none';
});
</script>
{% endblock %}
