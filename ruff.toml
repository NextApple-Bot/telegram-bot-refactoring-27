target-version = "py312"
line-length = 100

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
    "tmp",
    "topics",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF", "PL"]
ignore = ["E501", "B008", "SIM105", "PLR2004"]
fixable = ["ALL"]

[lint.isort]
known-first-party = ["bot", "web_admin"]

[lint.pylint]
max-args = 8
