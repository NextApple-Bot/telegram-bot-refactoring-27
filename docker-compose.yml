version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass123
      POSTGRES_DB: botdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: .
    container_name: telegram_bot_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./alembic/versions:/app/alembic/versions

  # === Cloudflare Tunnel (обновлённый) ===
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMmEzODRjZWY3MzZjYjdiMTg5ZjIzZjM0YmVkMjMxZDYiLCJ0IjoiMDEyMjBhZjAtNjFjZS00ZDVjLTk2ZWEtYTJiNTQ0ZDc3MzE5IiwicyI6Ik16TmlNR1V6WkRBdE56YzBZeTAwTTJaakxXSXlZMk10WVdSbE1USTNZVEk0TkdJMyJ9
    depends_on:
      - bot

volumes:
  postgres_data:
  redis_data:
